name: Deploy Vite to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          # Public HTTPS backend URL (repo variables). Empty -> app falls back to its default.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://laptop-l7qb89bs.taile16c9b.ts.net:8443/api/v1' }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://laptop-l7qb89bs.taile16c9b.ts.net:8443' }}
        run: npm run build
      - name: Prepare SPA fallback and prevent Jekyll processing
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
